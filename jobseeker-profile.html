<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Seeker Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { font-family: 'Poppins', sans-serif; font-weight: 200; box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f4f4f9; }
    h1,h2,h3,h4 { font-weight: 300; }
    button { font-family: 'Poppins', sans-serif; font-weight: 300; cursor: pointer; }
    input, textarea, select { font-family: 'Poppins', sans-serif; font-weight: 200; }
    ::-webkit-scrollbar { width: 4px; } 
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #595CEF44; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const ACCENT = "#595CEF";
    const ACCENT_LIGHT = "#EEEEFF";

    // ─── Reusable UI ─────────────────────────────────────────────
    function Btn({ children, onClick, outline, danger, small, style = {} }) {
      const base = {
        padding: small ? "6px 14px" : "9px 20px",
        borderRadius: 8,
        border: `1.5px solid ${danger ? "#e24b4a" : ACCENT}`,
        background: outline || danger ? "transparent" : ACCENT,
        color: outline ? ACCENT : danger ? "#e24b4a" : "#fff",
        fontSize: small ? 12 : 13,
        cursor: "pointer",
        transition: "opacity 0.15s",
        fontFamily: "Poppins",
        fontWeight: 300,
        ...style,
      };
      return (
        <button
          style={base}
          onClick={onClick}
          onMouseOver={e => e.currentTarget.style.opacity = 0.75}
          onMouseOut={e => e.currentTarget.style.opacity = 1}
        >
          {children}
        </button>
      );
    }

    function Card({ children, style = {} }) {
      return (
        <div style={{ background: "#fff", border: "1px solid #e8e8f0", borderRadius: 12, padding: "24px 28px", marginBottom: 16, ...style }}>
          {children}
        </div>
      );
    }

    function SectionHeader({ title, onAdd, addLabel = "Add" }) {
      return (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ fontSize: 15, color: "#111", fontWeight: 300 }}>{title}</h3>
          {onAdd && <Btn small outline onClick={onAdd}>+ {addLabel}</Btn>}
        </div>
      );
    }

    function Field({ label, children, required }) {
      return (
        <div style={{ marginBottom: 14 }}>
          <label style={{ fontSize: 12, color: "#666", display: "block", marginBottom: 4 }}>
            {label}{required && <span style={{ color: ACCENT }}> *</span>}
          </label>
          {children}
        </div>
      );
    }

    function Input({ value, onChange, placeholder, type = "text", style = {} }) {
      return (
        <input
          type={type}
          value={value}
          onChange={e => onChange(e.target.value)}
          placeholder={placeholder}
          style={{
            width: "100%", padding: "9px 12px", borderRadius: 8,
            border: "1px solid #ddd", fontSize: 13, outline: "none",
            background: "#fafafa", fontFamily: "Poppins", fontWeight: 200, ...style,
          }}
        />
      );
    }

    function Textarea({ value, onChange, placeholder, rows = 4 }) {
      return (
        <textarea
          rows={rows}
          value={value}
          onChange={e => onChange(e.target.value)}
          placeholder={placeholder}
          style={{
            width: "100%", padding: "9px 12px", borderRadius: 8,
            border: "1px solid #ddd", fontSize: 13, outline: "none",
            resize: "vertical", background: "#fafafa", fontFamily: "Poppins", fontWeight: 200,
          }}
        />
      );
    }

    function Tag({ label, onRemove }) {
      return (
        <span style={{
          display: "inline-flex", alignItems: "center", gap: 6,
          background: ACCENT_LIGHT, color: ACCENT, borderRadius: 20,
          padding: "4px 12px", fontSize: 12, margin: "4px",
        }}>
          {label}
          <span onClick={onRemove} style={{ cursor: "pointer", fontWeight: 400, fontSize: 14, lineHeight: 1 }}>×</span>
        </span>
      );
    }

    function Modal({ title, children, onClose }) {
      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 1000,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <div style={{
            background: "#fff", borderRadius: 14, padding: "28px 32px",
            width: "min(560px, 95vw)", maxHeight: "90vh", overflowY: "auto",
            boxShadow: "0 8px 40px rgba(0,0,0,0.15)",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 style={{ fontSize: 16, fontWeight: 300, color: "#111" }}>{title}</h3>
              <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#999" }}>×</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ─── PROFILE STRENGTH ────────────────────────────────────────
    function ProfileStrength({ sections }) {
      const filled = sections.filter(s => s.done).length;
      const pct = Math.round((filled / sections.length) * 100);
      return (
        <Card style={{ border: `1px solid ${ACCENT}20`, padding: "20px 24px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <p style={{ fontSize: 13, color: "#888" }}>Profile strength</p>
            <span style={{ fontSize: 13, color: ACCENT, fontWeight: 300 }}>{pct}%</span>
          </div>
          <div style={{ background: "#ebebf5", borderRadius: 6, height: 5, overflow: "hidden" }}>
            <div style={{ width: `${pct}%`, height: "100%", background: ACCENT, borderRadius: 6, transition: "width 0.6s ease" }} />
          </div>
          <div style={{ marginTop: 12, display: "flex", flexWrap: "wrap", gap: 5 }}>
            {sections.map(s => (
              <span key={s.name} style={{
                fontSize: 11, padding: "2px 10px", borderRadius: 20,
                background: s.done ? ACCENT_LIGHT : "#f3f3f3",
                color: s.done ? ACCENT : "#bbb",
              }}>
                {s.done ? "✓" : "·"} {s.name}
              </span>
            ))}
          </div>
        </Card>
      );
    }

    // ─── ABOUT ME ────────────────────────────────────────────────
    function AboutSection({ data, onChange }) {
      const [editing, setEditing] = useState(!data);
      const [val, setVal] = useState(data || "");
      const save = () => { onChange(val); setEditing(false); };
      return (
        <Card>
          <SectionHeader title="About me" />
          {editing ? (
            <>
              <Textarea value={val} onChange={setVal} placeholder="Write a brief professional summary about yourself…" rows={5} />
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <Btn onClick={save}>Save</Btn>
                {data && <Btn outline onClick={() => setEditing(false)}>Cancel</Btn>}
              </div>
            </>
          ) : (
            <div>
              <p style={{ fontSize: 13, color: "#444", lineHeight: 1.8 }}>{data}</p>
              <div style={{ marginTop: 12 }}>
                <Btn small outline onClick={() => setEditing(true)}>Edit</Btn>
              </div>
            </div>
          )}
        </Card>
      );
    }

    // ─── CAREER HISTORY ──────────────────────────────────────────
    const emptyJob = () => ({ id: Date.now(), title: "", company: "", from: "", to: "", current: false, description: "" });

    function CareerItem({ job, onEdit, onDelete }) {
      return (
        <div style={{ borderBottom: "1px solid #f0f0f0", padding: "14px 0", display: "flex", justifyContent: "space-between" }}>
          <div style={{ flex: 1 }}>
            <p style={{ fontSize: 14, fontWeight: 300, color: "#111" }}>{job.title || <span style={{ color: "#bbb" }}>Untitled role</span>}</p>
            <p style={{ fontSize: 12, color: "#666", marginTop: 2 }}>{job.company}</p>
            <p style={{ fontSize: 11, color: "#aaa", marginTop: 2 }}>
              {job.from}{job.from && " – "}{job.current ? "Present" : job.to}
            </p>
            {job.description && <p style={{ fontSize: 12, color: "#555", marginTop: 6, lineHeight: 1.7 }}>{job.description}</p>}
          </div>
          <div style={{ display: "flex", gap: 6, alignItems: "flex-start", marginLeft: 12 }}>
            <Btn small outline onClick={() => onEdit(job)}>Edit</Btn>
            <Btn small danger onClick={() => onDelete(job.id)}>Delete</Btn>
          </div>
        </div>
      );
    }

    function CareerModal({ job, onSave, onClose }) {
      const [form, setForm] = useState({ ...job });
      const set = k => v => setForm(f => ({ ...f, [k]: v }));
      return (
        <Modal title={job.title ? "Edit experience" : "Add experience"} onClose={onClose}>
          <Field label="Job title" required><Input value={form.title} onChange={set("title")} placeholder="e.g. Senior Designer" /></Field>
          <Field label="Company" required><Input value={form.company} onChange={set("company")} placeholder="Company name" /></Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label="From"><Input type="month" value={form.from} onChange={set("from")} /></Field>
            <Field label="To"><Input type="month" value={form.to} onChange={set("to")} style={{ opacity: form.current ? 0.4 : 1 }} /></Field>
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 14, cursor: "pointer" }}>
            <input type="checkbox" checked={form.current} onChange={e => setForm(f => ({ ...f, current: e.target.checked, to: "" }))} />
            I currently work here
          </label>
          <Field label="Job description">
            <Textarea value={form.description} onChange={set("description")} placeholder="Describe your responsibilities and achievements…" />
          </Field>
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <Btn onClick={() => onSave(form)}>Save</Btn>
            <Btn outline onClick={onClose}>Cancel</Btn>
          </div>
        </Modal>
      );
    }

    function CareerSection({ data, onChange }) {
      const [modal, setModal] = useState(null);
      const save = (job) => {
        if (data.find(j => j.id === job.id)) onChange(data.map(j => j.id === job.id ? job : j));
        else onChange([...data, { ...job, id: Date.now() }]);
        setModal(null);
      };
      return (
        <Card>
          <SectionHeader title="Career history" onAdd={() => setModal(emptyJob())} addLabel="Add experience" />
          {data.length === 0 && <p style={{ fontSize: 13, color: "#bbb" }}>No experience added yet.</p>}
          {data.map(j => (
            <CareerItem key={j.id} job={j} onEdit={setModal} onDelete={id => onChange(data.filter(j => j.id !== id))} />
          ))}
          {modal && <CareerModal job={modal} onSave={save} onClose={() => setModal(null)} />}
        </Card>
      );
    }

    // ─── EDUCATION ───────────────────────────────────────────────
    const emptyEdu = () => ({ id: Date.now(), degree: "", university: "", year: "" });

    function EduSection({ data, onChange }) {
      const [modal, setModal] = useState(null);
      const [form, setForm] = useState(null);
      const open = item => { setForm({ ...item }); setModal(true); };
      const save = () => {
        if (data.find(e => e.id === form.id)) onChange(data.map(e => e.id === form.id ? form : e));
        else onChange([...data, { ...form, id: Date.now() }]);
        setModal(false);
      };
      const set = k => v => setForm(f => ({ ...f, [k]: v }));
      return (
        <Card>
          <SectionHeader title="Education" onAdd={() => open(emptyEdu())} addLabel="Add education" />
          {data.length === 0 && <p style={{ fontSize: 13, color: "#bbb" }}>No education added yet.</p>}
          {data.map(e => (
            <div key={e.id} style={{ borderBottom: "1px solid #f0f0f0", padding: "12px 0", display: "flex", justifyContent: "space-between" }}>
              <div>
                <p style={{ fontSize: 14, fontWeight: 300 }}>{e.degree || <span style={{ color: "#bbb" }}>Degree</span>}</p>
                <p style={{ fontSize: 12, color: "#666" }}>{e.university}</p>
                <p style={{ fontSize: 11, color: "#aaa" }}>{e.year}</p>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <Btn small outline onClick={() => open(e)}>Edit</Btn>
                <Btn small danger onClick={() => onChange(data.filter(x => x.id !== e.id))}>Delete</Btn>
              </div>
            </div>
          ))}
          {modal && form && (
            <Modal title="Education" onClose={() => setModal(false)}>
              <Field label="Degree / Qualification" required><Input value={form.degree} onChange={set("degree")} placeholder="e.g. Bachelor of Commerce" /></Field>
              <Field label="University / Institution" required><Input value={form.university} onChange={set("university")} placeholder="Institution name" /></Field>
              <Field label="Year completed"><Input type="number" value={form.year} onChange={set("year")} placeholder="e.g. 2019" /></Field>
              <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                <Btn onClick={save}>Save</Btn>
                <Btn outline onClick={() => setModal(false)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </Card>
      );
    }

    // ─── LICENCES & CERTS ────────────────────────────────────────
    const emptyCert = () => ({ id: Date.now(), name: "", issuer: "", year: "" });

    function CertsSection({ data, onChange }) {
      const [modal, setModal] = useState(null);
      const [form, setForm] = useState(null);
      const open = item => { setForm({ ...item }); setModal(true); };
      const save = () => {
        if (data.find(e => e.id === form.id)) onChange(data.map(e => e.id === form.id ? form : e));
        else onChange([...data, { ...form, id: Date.now() }]);
        setModal(false);
      };
      const set = k => v => setForm(f => ({ ...f, [k]: v }));
      return (
        <Card>
          <SectionHeader title="Licences & certifications" onAdd={() => open(emptyCert())} addLabel="Add licence" />
          {data.length === 0 && <p style={{ fontSize: 13, color: "#bbb" }}>No licences or certifications added yet.</p>}
          {data.map(c => (
            <div key={c.id} style={{ borderBottom: "1px solid #f0f0f0", padding: "12px 0", display: "flex", justifyContent: "space-between" }}>
              <div>
                <p style={{ fontSize: 14, fontWeight: 300 }}>{c.name || <span style={{ color: "#bbb" }}>Certification</span>}</p>
                <p style={{ fontSize: 12, color: "#666" }}>{c.issuer}</p>
                <p style={{ fontSize: 11, color: "#aaa" }}>{c.year}</p>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <Btn small outline onClick={() => open(c)}>Edit</Btn>
                <Btn small danger onClick={() => onChange(data.filter(x => x.id !== c.id))}>Delete</Btn>
              </div>
            </div>
          ))}
          {modal && form && (
            <Modal title="Licence / Certification" onClose={() => setModal(false)}>
              <Field label="Certification name" required><Input value={form.name} onChange={set("name")} placeholder="e.g. AWS Certified Solutions Architect" /></Field>
              <Field label="Issuing organisation"><Input value={form.issuer} onChange={set("issuer")} placeholder="e.g. Amazon Web Services" /></Field>
              <Field label="Year issued"><Input type="number" value={form.year} onChange={set("year")} placeholder="e.g. 2023" /></Field>
              <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                <Btn onClick={save}>Save</Btn>
                <Btn outline onClick={() => setModal(false)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </Card>
      );
    }

    // ─── SKILLS ──────────────────────────────────────────────────
    function SkillsSection({ data, onChange }) {
      const [input, setInput] = useState("");
      const add = () => {
        const skill = input.trim();
        if (skill && !data.includes(skill)) { onChange([...data, skill]); setInput(""); }
      };
      return (
        <Card>
          <SectionHeader title="Skills" />
          <div style={{ display: "flex", flexWrap: "wrap", marginBottom: data.length ? 12 : 0 }}>
            {data.map(s => <Tag key={s} label={s} onRemove={() => onChange(data.filter(x => x !== s))} />)}
          </div>
          {data.length === 0 && <p style={{ fontSize: 13, color: "#bbb", marginBottom: 10 }}>No skills added yet.</p>}
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && add()}
              placeholder="Type a skill and press Enter…"
              style={{ flex: 1, padding: "9px 12px", borderRadius: 8, border: "1px solid #ddd", fontSize: 13, fontFamily: "Poppins", fontWeight: 200, outline: "none" }}
            />
            <Btn onClick={add}>Add</Btn>
          </div>
        </Card>
      );
    }

    // ─── LANGUAGES ───────────────────────────────────────────────
    const LEVELS = ["Basic", "Conversational", "Professional", "Native"];

    function LanguagesSection({ data, onChange }) {
      const [modal, setModal] = useState(false);
      const [form, setForm] = useState({ lang: "", level: "Professional" });
      const save = () => {
        if (form.lang.trim()) { onChange([...data, { ...form, id: Date.now() }]); setForm({ lang: "", level: "Professional" }); setModal(false); }
      };
      return (
        <Card>
          <SectionHeader title="Languages" onAdd={() => setModal(true)} addLabel="Add language" />
          {data.length === 0 && <p style={{ fontSize: 13, color: "#bbb" }}>No languages added yet.</p>}
          {data.map(l => (
            <div key={l.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #f0f0f0", padding: "10px 0" }}>
              <div>
                <p style={{ fontSize: 13, fontWeight: 300 }}>{l.lang}</p>
                <p style={{ fontSize: 11, color: ACCENT }}>{l.level}</p>
              </div>
              <Btn small danger onClick={() => onChange(data.filter(x => x.id !== l.id))}>Remove</Btn>
            </div>
          ))}
          {modal && (
            <Modal title="Add language" onClose={() => setModal(false)}>
              <Field label="Language" required>
                <Input value={form.lang} onChange={v => setForm(f => ({ ...f, lang: v }))} placeholder="e.g. French" />
              </Field>
              <Field label="Proficiency">
                <select value={form.level} onChange={e => setForm(f => ({ ...f, level: e.target.value }))}
                  style={{ width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid #ddd", fontSize: 13, fontFamily: "Poppins" }}>
                  {LEVELS.map(l => <option key={l}>{l}</option>)}
                </select>
              </Field>
              <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                <Btn onClick={save}>Save</Btn>
                <Btn outline onClick={() => setModal(false)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </Card>
      );
    }

    // ─── CV UPLOAD ───────────────────────────────────────────────
    function CVSection({ cvs, onChange }) {
      const fileRef = useRef();
      const handleFile = e => {
        const file = e.target.files[0];
        if (!file) return;
        const cv = { id: Date.now(), name: file.name, size: (file.size / 1024).toFixed(1) + " KB", date: new Date().toLocaleDateString() };
        onChange([...cvs, cv]);
        e.target.value = "";
      };
      return (
        <Card>
          <SectionHeader title="CV / Resume" />
          {cvs.length === 0 ? (
            <div onClick={() => fileRef.current.click()} style={{
              border: `2px dashed ${ACCENT}50`, borderRadius: 10, padding: "28px 20px",
              textAlign: "center", cursor: "pointer", background: ACCENT_LIGHT + "50",
            }}>
              <p style={{ fontSize: 13, color: "#888" }}>Click to upload your CV</p>
              <p style={{ fontSize: 11, color: "#bbb", marginTop: 4 }}>PDF, DOC, DOCX up to 5MB</p>
            </div>
          ) : (
            <>
              {cvs.map(cv => (
                <div key={cv.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fafafa", borderRadius: 8, padding: "12px 14px", marginBottom: 8, border: "1px solid #eee" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ background: ACCENT_LIGHT, color: ACCENT, borderRadius: 6, padding: "6px 8px", fontSize: 11, fontWeight: 400 }}>PDF</div>
                    <div>
                      <p style={{ fontSize: 13, fontWeight: 300 }}>{cv.name}</p>
                      <p style={{ fontSize: 11, color: "#aaa" }}>{cv.size} · Uploaded {cv.date}</p>
                    </div>
                  </div>
                  <Btn small danger onClick={() => onChange(cvs.filter(c => c.id !== cv.id))}>Delete</Btn>
                </div>
              ))}
              <button onClick={() => fileRef.current.click()} style={{ background: "none", border: "none", color: ACCENT, fontSize: 13, cursor: "pointer", padding: "8px 0", fontFamily: "Poppins" }}>
                + Upload another CV
              </button>
            </>
          )}
          <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }} onChange={handleFile} />
        </Card>
      );
    }

    // ─── VERIFICATION ────────────────────────────────────────────
    function VerificationSection({ status, onSubmit }) {
      const [modal, setModal] = useState(false);
      const [docType, setDocType] = useState("Passport");
      const fileRef = useRef();
      const [file, setFile] = useState(null);
      const submit = () => { if (!file) return; onSubmit("pending"); setModal(false); };
      const statuses = {
        none:    { label: "Not verified",          color: "#aaa",     bg: "#f5f5f5" },
        pending: { label: "Verification pending",  color: "#ef9f27",  bg: "#faeeda" },
        verified:{ label: "Verified ✓",            color: "#1D9E75",  bg: "#e1f5ee" },
      };
      const s = statuses[status];
      return (
        <Card>
          <SectionHeader title="Identity verification" />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <span style={{ fontSize: 12, background: s.bg, color: s.color, padding: "4px 12px", borderRadius: 20 }}>{s.label}</span>
              <p style={{ fontSize: 12, color: "#888", marginTop: 8, lineHeight: 1.6 }}>
                Submit a government-issued ID to get a verified badge on your profile.
              </p>
            </div>
            {status === "none" && <Btn small onClick={() => setModal(true)}>Verify me</Btn>}
          </div>
          {modal && (
            <Modal title="Submit ID for verification" onClose={() => setModal(false)}>
              <Field label="Document type">
                <select value={docType} onChange={e => setDocType(e.target.value)}
                  style={{ width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid #ddd", fontSize: 13, fontFamily: "Poppins" }}>
                  {["Passport", "Driver's licence", "National ID card"].map(d => <option key={d}>{d}</option>)}
                </select>
              </Field>
              <Field label="Upload document">
                <div onClick={() => fileRef.current.click()} style={{ border: `2px dashed ${ACCENT}50`, borderRadius: 8, padding: "20px", textAlign: "center", cursor: "pointer", background: ACCENT_LIGHT + "50" }}>
                  {file ? <p style={{ fontSize: 13, color: ACCENT }}>{file.name}</p> : <p style={{ fontSize: 13, color: "#bbb" }}>Click to upload</p>}
                </div>
                <input ref={fileRef} type="file" style={{ display: "none" }} onChange={e => setFile(e.target.files[0])} />
              </Field>
              <p style={{ fontSize: 11, color: "#aaa", marginBottom: 14 }}>
                Your document will be reviewed within 1–2 business days and deleted after verification.
              </p>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={submit}>Submit</Btn>
                <Btn outline onClick={() => setModal(false)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </Card>
      );
    }

    // ─── VISIBILITY TOGGLE ───────────────────────────────────────
    function VisibilitySection({ value, onChange }) {
      const isPublic = value === "Public";
      return (
        <Card style={{ padding: "18px 24px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <p style={{ fontSize: 14, color: "#111", fontWeight: 300 }}>Profile visibility</p>
              <p style={{ fontSize: 12, color: "#aaa", marginTop: 2 }}>
                {isPublic ? "Visible to all employers" : "Hidden from searches"}
              </p>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 12, color: isPublic ? "#bbb" : "#555" }}>Private</span>
              <div onClick={() => onChange(isPublic ? "Private" : "Public")}
                style={{ width: 44, height: 24, borderRadius: 12, cursor: "pointer", background: isPublic ? ACCENT : "#ddd", position: "relative", transition: "background 0.25s" }}>
                <div style={{ width: 18, height: 18, borderRadius: "50%", background: "#fff", position: "absolute", top: 3, left: isPublic ? 23 : 3, transition: "left 0.25s", boxShadow: "0 1px 4px rgba(0,0,0,0.18)" }} />
              </div>
              <span style={{ fontSize: 12, color: isPublic ? "#555" : "#bbb" }}>Public</span>
            </div>
          </div>
        </Card>
      );
    }

    // ─── PROFILE HEADER ──────────────────────────────────────────
    function ProfileHeader({ name, title, verified }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 20, marginBottom: 20 }}>
          <div style={{ width: 80, height: 80, borderRadius: "50%", background: `linear-gradient(135deg, ${ACCENT}, #9599f5)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, color: "#fff", fontWeight: 300 }}>
            {name.split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase()}
          </div>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <h1 style={{ fontSize: 20, fontWeight: 300, color: "#111" }}>{name}</h1>
              {verified === "verified" && (
                <span style={{ background: "#e1f5ee", color: "#1D9E75", fontSize: 11, padding: "2px 10px", borderRadius: 20 }}>✓ Verified</span>
              )}
            </div>
            <p style={{ fontSize: 13, color: "#888", marginTop: 2 }}>{title || "Add your professional title"}</p>
          </div>
        </div>
      );
    }

    // ─── MAIN APP ────────────────────────────────────────────────
    function App() {
      const [about, setAbout] = useState("");
      const [career, setCareer] = useState([]);
      const [education, setEducation] = useState([]);
      const [certs, setCerts] = useState([]);
      const [skills, setSkills] = useState([]);
      const [languages, setLanguages] = useState([]);
      const [cvs, setCvs] = useState([]);
      const [visibility, setVisibility] = useState("Public");
      const [verification, setVerification] = useState("none");
      const [activeTab, setActiveTab] = useState("profile");

      const sections = [
        { name: "About me",   done: !!about },
        { name: "Career",     done: career.length > 0 },
        { name: "Education",  done: education.length > 0 },
        { name: "Licences",   done: certs.length > 0 },
        { name: "Skills",     done: skills.length > 0 },
        { name: "Languages",  done: languages.length > 0 },
        { name: "CV uploaded",done: cvs.length > 0 },
        { name: "Verified",   done: verification === "verified" },
      ];

      const tabs = ["profile", "settings"];

      return (
        <div style={{ background: "#f4f4f9", minHeight: "100vh" }}>
          {/* Nav */}
          <div style={{ background: "#fff", borderBottom: "1px solid #eee", padding: "0 32px", display: "flex", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "16px 0", marginRight: 40 }}>
              <div style={{ width: 28, height: 28, background: ACCENT, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <span style={{ color: "#fff", fontSize: 14, fontWeight: 400 }}>H</span>
              </div>
              <span style={{ fontSize: 15, fontWeight: 300, color: "#111" }}>HireHub</span>
            </div>
            {tabs.map(t => (
              <button key={t} onClick={() => setActiveTab(t)} style={{
                background: "none", border: "none", padding: "20px 16px", fontSize: 13, cursor: "pointer",
                fontFamily: "Poppins", fontWeight: 200,
                color: activeTab === t ? ACCENT : "#666",
                borderBottom: activeTab === t ? `2px solid ${ACCENT}` : "2px solid transparent",
                textTransform: "capitalize",
              }}>
                {t}
              </button>
            ))}
          </div>

          {/* Content */}
          <div style={{ maxWidth: 780, margin: "32px auto", padding: "0 16px" }}>
            <ProfileHeader name="Alex Johnson" title="UX Designer · Auckland, NZ" verified={verification} />
            <ProfileStrength sections={sections} />

            {activeTab === "profile" && (
              <>
                <VisibilitySection value={visibility} onChange={setVisibility} />
                <AboutSection data={about} onChange={setAbout} />
                <CareerSection data={career} onChange={setCareer} />
                <EduSection data={education} onChange={setEducation} />
                <CertsSection data={certs} onChange={setCerts} />
                <SkillsSection data={skills} onChange={setSkills} />
                <LanguagesSection data={languages} onChange={setLanguages} />
                <CVSection cvs={cvs} onChange={setCvs} />
                <VerificationSection status={verification} onSubmit={setVerification} />
              </>
            )}

            {activeTab === "settings" && (
              <div style={{ background: "#fff", border: "1px solid #e8e8f0", borderRadius: 12, padding: "24px 28px" }}>
                <h3 style={{ fontSize: 15, marginBottom: 16, fontWeight: 300 }}>Account settings</h3>
                <Field label="Full name"><Input value="Alex Johnson" onChange={() => {}} /></Field>
                <Field label="Email"><Input value="alex@example.com" onChange={() => {}} /></Field>
                <Field label="Phone"><Input value="+64 21 000 0000" onChange={() => {}} placeholder="+64..." /></Field>
                <Field label="Location"><Input value="Auckland, New Zealand" onChange={() => {}} /></Field>
                <div style={{ marginTop: 8 }}><Btn>Save changes</Btn></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
